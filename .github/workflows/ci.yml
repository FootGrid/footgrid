name: FootGrid CI #TODO(anshu): Update once multiple workflows are integrated.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

#TODO(anshu): Add jobs 'build', 'deploy' 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify module files
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate OpenAPI
        run: ruby -e "require 'yaml'; d=YAML.load_file('api/openapi.yaml'); abort unless d['openapi'] == '3.1.0'"
