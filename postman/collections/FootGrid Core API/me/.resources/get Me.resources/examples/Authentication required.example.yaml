$kind: http-example
request:
  url: "{{baseUrl}}/me"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "title": "string",
        "status": 6822,
        "trace_id": "string",
        "detail": "string"
      }
order: 2000
