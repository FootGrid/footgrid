services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: footgrid
      POSTGRES_USER: footgrid
      POSTGRES_PASSWORD: footgrid
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footgrid -d footgrid"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
